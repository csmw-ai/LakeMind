name: Build

on:
  push:
    branches: [master, main, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.agent/**'
      - 'reports/**'
      - 'LICENSE'
  pull_request:
    branches: [master, main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.agent/**'
      - 'reports/**'
      - 'LICENSE'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io/csmw-ai/lakemind

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        run: pip install uv
      - name: Run unit tests
        run: |
          cd LakeMindServer
          uv sync --frozen
          uv run pytest tests/ -v --tb=short

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        target: [postgres-age, server-api, mcp-suite, model-serving, control-center, ray-worker]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/bake-action@v5
        env:
          REGISTRY: ${{ env.REGISTRY }}
          VERSION: ${{ github.sha }}
        with:
          files: docker-bake.hcl
          targets: ${{ matrix.target }}
          push: ${{ github.event_name != 'pull_request' }}
          set: |
            *.cache-from=type=gha,scope=${{ matrix.target }}
            *.cache-to=type=gha,mode=max,scope=${{ matrix.target }}

  meeting-agent:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build frontend
        run: |
          cd examples/meeting-agent/frontend
          npm install
          npm run build
      - uses: docker/build-push-action@v6
        with:
          context: examples/meeting-agent
          file: examples/meeting-agent/Dockerfile
          tags: |
            ${{ env.REGISTRY }}/meeting-agent:latest
            ${{ env.REGISTRY }}/meeting-agent:${{ github.sha }}
          push: ${{ github.event_name != 'pull_request' }}
          cache-from: type=gha,scope=meeting-agent
          cache-to: type=gha,mode=max,scope=meeting-agent
