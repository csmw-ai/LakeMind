server:
  host: "0.0.0.0"
  port: 10824
  api_key: "lakemind-modelserving-key"

gateway:
  default_chat_model: "deepseek-v4-flash"
  default_embed_model: "jina-embeddings-v2-base-zh"
  fallback:
    chat: ["deepseek-v4-flash"]
    embed: ["jina-embeddings-v2-base-zh"]
  cache: false

providers:
  - name: "modelarts"
    type: "openai"
    base_url: "https://api.modelarts-maas.com/openai/v1"
    api_key: "${MAAS_API_KEY}"
  # - name: "openai"
  #   type: "openai"
  #   base_url: "https://api.openai.com/v1"
  #   api_key: "${OPENAI_API_KEY}"
  # - name: "ollama"
  #   type: "ollama"
  #   base_url: "http://host.docker.internal:11434"
  #   api_key: "ollama"

models:
  - name: "deepseek-v4-flash"
    model_type: "chat"
    provider: "modelarts"
    source: "external"
    context_length: 64000
    capabilities: [chat]
    priority: 1
  # - name: "gpt-4o-mini"
  #   model_type: "chat"
  #   provider: "openai"
  #   source: "external"
  #   context_length: 128000
  #   capabilities: [chat, vision]
  #   priority: 2

embedding:
  built_in:
    enabled: false
    ray_managed: true
    provider: "fastembed"
    model: "jinaai/jina-embeddings-v2-base-zh"
    dim: 768
    cache_dir: "/data/fastembed_cache"
  external: []

asr:
  total_concurrency: 2
  built_in:
    enabled: false
    ray_managed: true
    required: false
    preload: false
    provider: "sensevoice-funasr"
    model_alias: "sensevoice-small"
    model_id: "iic/SenseVoiceSmall"
    model_path: "/models/asr/sensevoice-small"
    language: "zh"
    device: "cpu"
    intra_threads: 2
    inter_threads: 1
    concurrency: 2
    use_itn: true
    vad: true
    vad_model: "fsmn-vad"
    max_upload_mb: 100
    request_timeout_seconds: 600
  external: []

registry:
  host: "lakemind-postgres"
  port: 5432
  db: "lakemind"
  user: "lakemind"
  password: "lakemind_pass"
